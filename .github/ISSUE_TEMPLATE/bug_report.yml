name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a session with ...
        2. Wait ...
        3. The band shows ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Desktop app, Terminal, VS Code, Other]
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: contextwatch version
      description: The `version` in `.claude-plugin/plugin.json`.
